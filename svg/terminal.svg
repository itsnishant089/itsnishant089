      <text class="ascii-logo" x="0" y="58"> ██║╚██╗██║██║╚════██║██╔══██║██╔══██║██║╚██╗██║   ██║</text>
      <text class="ascii-logo" x="0" y="70"> ██║ ╚████║██║███████║██║  ██║██║  ██║██║ ╚████║   ██║</text>
      <text class="ascii-logo" x="0" y="82"> ╚═╝  ╚═══╝╚═╝╚══════╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═══╝   ╚═╝</text>

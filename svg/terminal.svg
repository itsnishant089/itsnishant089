<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 680" role="img" aria-label="Nishant's Terminal Session">
  <title>Terminal — nishant@dev Interactive Session</title>
  <defs>
    <style>
      /* ============================================
         TERMINAL.SVG — Linux Terminal Simulator
         Theme: Dark Hacker + Matrix + Cyberpunk
         Author: Nishant (itsnishant089)
         Pure CSS animations, no JavaScript.
         ============================================ */

      @keyframes cursor-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes scanline {
        0% { transform: translateY(-700px); }
        100% { transform: translateY(700px); }
      }

      @keyframes reveal-1 { 0%, 5% { opacity: 0; } 6%, 100% { opacity: 1; } }
      @keyframes reveal-2 { 0%, 10% { opacity: 0; } 11%, 100% { opacity: 1; } }
      @keyframes reveal-3 { 0%, 15% { opacity: 0; } 16%, 100% { opacity: 1; } }
      @keyframes reveal-4 { 0%, 20% { opacity: 0; } 21%, 100% { opacity: 1; } }
      @keyframes reveal-5 { 0%, 28% { opacity: 0; } 29%, 100% { opacity: 1; } }
      @keyframes reveal-6 { 0%, 33% { opacity: 0; } 34%, 100% { opacity: 1; } }
      @keyframes reveal-7 { 0%, 38% { opacity: 0; } 39%, 100% { opacity: 1; } }
      @keyframes reveal-8 { 0%, 43% { opacity: 0; } 44%, 100% { opacity: 1; } }
      @keyframes reveal-9 { 0%, 50% { opacity: 0; } 51%, 100% { opacity: 1; } }
      @keyframes reveal-10 { 0%, 55% { opacity: 0; } 56%, 100% { opacity: 1; } }
      @keyframes reveal-11 { 0%, 60% { opacity: 0; } 61%, 100% { opacity: 1; } }
      @keyframes reveal-12 { 0%, 65% { opacity: 0; } 66%, 100% { opacity: 1; } }
      @keyframes reveal-13 { 0%, 68% { opacity: 0; } 69%, 100% { opacity: 1; } }
      @keyframes reveal-14 { 0%, 72% { opacity: 0; } 73%, 100% { opacity: 1; } }
      @keyframes reveal-15 { 0%, 76% { opacity: 0; } 77%, 100% { opacity: 1; } }
      @keyframes reveal-16 { 0%, 80% { opacity: 0; } 81%, 100% { opacity: 1; } }
      @keyframes reveal-17 { 0%, 83% { opacity: 0; } 84%, 100% { opacity: 1; } }
      @keyframes reveal-18 { 0%, 86% { opacity: 0; } 87%, 100% { opacity: 1; } }
      @keyframes reveal-19 { 0%, 89% { opacity: 0; } 90%, 100% { opacity: 1; } }
      @keyframes reveal-20 { 0%, 92% { opacity: 0; } 93%, 100% { opacity: 1; } }
      @keyframes reveal-21 { 0%, 95% { opacity: 0; } 96%, 100% { opacity: 1; } }

      @keyframes border-pulse {
        0%, 100% { stroke: #00ff88; stroke-opacity: 0.3; }
        50% { stroke: #00c6ff; stroke-opacity: 0.6; }
      }

      /* Base */
      .bg { fill: #0d1117; }
      .frame {
        fill: none;
        stroke: #00ff88;
        stroke-width: 1.5;
        rx: 12;
        animation: border-pulse 4s ease-in-out infinite;
      }
      .titlebar { fill: #111827; }
      .titlebar-line { stroke: #1e293b; stroke-width: 1; }
      .btn-r { fill: #ff5f56; }
      .btn-y { fill: #ffbd2e; }
      .btn-g { fill: #27c93f; }
      .title-text {
        font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
        font-size: 11px;
        fill: #6b7280;
        text-anchor: middle;
      }

      /* Text classes */
      .prompt {
        font-family: 'Courier New', monospace;
        font-size: 13px;
        fill: #00c6ff;
      }
      .cmd {
        font-family: 'Courier New', monospace;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .out {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        fill: #00ff88;
      }
      .out-dim {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        fill: #00ff88;
        opacity: 0.6;
      }
      .out-cyan {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        fill: #00c6ff;
      }
      .out-white {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        fill: #e2e8f0;
      }
      .out-yellow {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        fill: #ffbd2e;
      }
      .out-red {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        fill: #ff5f56;
      }
      .out-gray {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        fill: #6b7280;
      }
      .comment {
        font-family: 'Courier New', monospace;
        font-size: 11px;
        fill: #4b5563;
      }
      .ascii-logo {
        font-family: 'Courier New', monospace;
        font-size: 10px;
        fill: #00ff88;
      }
      .ascii-logo-bright {
        font-family: 'Courier New', monospace;
        font-size: 10px;
        fill: #00ff88;
        opacity: 0.8;
      }
      .cursor {
        fill: #00ff88;
        animation: cursor-blink 1s step-end infinite;
      }
      .scanline-bar {
        fill: rgba(0, 255, 136, 0.025);
        animation: scanline 8s linear infinite;
      }

      /* Reveal animation classes */
      .r1 { opacity: 0; animation: reveal-1 20s ease-out forwards; }
      .r2 { opacity: 0; animation: reveal-2 20s ease-out forwards; }
      .r3 { opacity: 0; animation: reveal-3 20s ease-out forwards; }
      .r4 { opacity: 0; animation: reveal-4 20s ease-out forwards; }
      .r5 { opacity: 0; animation: reveal-5 20s ease-out forwards; }
      .r6 { opacity: 0; animation: reveal-6 20s ease-out forwards; }
      .r7 { opacity: 0; animation: reveal-7 20s ease-out forwards; }
      .r8 { opacity: 0; animation: reveal-8 20s ease-out forwards; }
      .r9 { opacity: 0; animation: reveal-9 20s ease-out forwards; }
      .r10 { opacity: 0; animation: reveal-10 20s ease-out forwards; }
      .r11 { opacity: 0; animation: reveal-11 20s ease-out forwards; }
      .r12 { opacity: 0; animation: reveal-12 20s ease-out forwards; }
      .r13 { opacity: 0; animation: reveal-13 20s ease-out forwards; }
      .r14 { opacity: 0; animation: reveal-14 20s ease-out forwards; }
      .r15 { opacity: 0; animation: reveal-15 20s ease-out forwards; }
      .r16 { opacity: 0; animation: reveal-16 20s ease-out forwards; }
      .r17 { opacity: 0; animation: reveal-17 20s ease-out forwards; }
      .r18 { opacity: 0; animation: reveal-18 20s ease-out forwards; }
      .r19 { opacity: 0; animation: reveal-19 20s ease-out forwards; }
      .r20 { opacity: 0; animation: reveal-20 20s ease-out forwards; }
      .r21 { opacity: 0; animation: reveal-21 20s ease-out forwards; }

      /* CRT scanline pattern */
      .crt-lines { opacity: 0.4; }
    </style>

    <!-- Filters -->
    <filter id="term-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="term-shadow" x="-5%" y="-3%" width="110%" height="112%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- CRT line pattern -->
    <pattern id="crt-pattern" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="transparent"/>
      <rect y="2" width="4" height="2" fill="rgba(0,0,0,0.06)"/>
    </pattern>
  </defs>

  <!-- Full background -->
  <rect class="bg" width="850" height="680"/>

  <!-- Terminal window -->
  <g filter="url(#term-shadow)">

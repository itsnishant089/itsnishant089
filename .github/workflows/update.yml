name: Update Dynamic Profile Content

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  # Allow manual triggers
  workflow_dispatch:
  # Run on pushes to main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ==================================================
  # JOB 1: Generate Contribution Snake Animation
  # ==================================================
  generate-snake:
    name: Generate Snake Animation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: itsnishant089
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'chore: update contribution snake animation'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



  # ==================================================
  # JOB 3: Update Visitor Badge Data
  # ==================================================
  update-visitor-data:
    name: Update Visitor Tracking
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log workflow run
        run: |
          echo "Profile update workflow completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Snake animation, metrics, and visitor data have been refreshed."
          echo ""
          echo "Generated assets:"
          echo "  - dist/github-snake.svg"
          echo "  - dist/github-snake-dark.svg"
          echo "  - dist/metrics-overview.svg"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      @keyframes fall-1 {
        0% { transform: translateY(-100%); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(600px); opacity: 0; }
      }
      @keyframes fall-2 {
        0% { transform: translateY(-100%); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateY(600px); opacity: 0; }
      }
      @keyframes fall-3 {
        0% { transform: translateY(-100%); opacity: 0; }
        10% { opacity: 0.6; }
        90% { opacity: 0.6; }
        100% { transform: translateY(600px); opacity: 0; }
      }
      @keyframes glow-pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
      }
      .matrix-bg { fill: #0d1117; }
      .matrix-col { font-family: 'Courier New', monospace; font-size: 14px; fill: #00ff88; }
      .matrix-col-dim { font-family: 'Courier New', monospace; font-size: 14px; fill: #00ff88; opacity: 0.3; }
      .col-1 { animation: fall-1 4s linear infinite; }
      .col-2 { animation: fall-2 5.5s linear infinite; animation-delay: 0.3s; }
      .col-3 { animation: fall-1 3.8s linear infinite; animation-delay: 0.7s; }
      .col-4 { animation: fall-3 6s linear infinite; animation-delay: 1.1s; }
      .col-5 { animation: fall-2 4.5s linear infinite; animation-delay: 0.5s; }
      .col-6 { animation: fall-1 5s linear infinite; animation-delay: 1.5s; }
      .col-7 { animation: fall-3 3.5s linear infinite; animation-delay: 0.2s; }
      .col-8 { animation: fall-2 6.5s linear infinite; animation-delay: 0.8s; }
      .col-9 { animation: fall-1 4.2s linear infinite; animation-delay: 1.3s; }
      .col-10 { animation: fall-3 5.2s linear infinite; animation-delay: 0.6s; }
      .col-11 { animation: fall-2 3.9s linear infinite; animation-delay: 1.8s; }
      .col-12 { animation: fall-1 5.8s linear infinite; animation-delay: 0.4s; }
      .col-13 { animation: fall-3 4.7s linear infinite; animation-delay: 1.0s; }
      .col-14 { animation: fall-2 3.6s linear infinite; animation-delay: 1.6s; }
      .col-15 { animation: fall-1 5.3s linear infinite; animation-delay: 0.9s; }
      .col-16 { animation: fall-3 4.1s linear infinite; animation-delay: 1.2s; }
      .col-17 { animation: fall-2 5.7s linear infinite; animation-delay: 0.1s; }
      .col-18 { animation: fall-1 4.9s linear infinite; animation-delay: 1.4s; }
      .col-19 { animation: fall-3 3.7s linear infinite; animation-delay: 0.5s; }
      .col-20 { animation: fall-2 6.2s linear infinite; animation-delay: 1.7s; }
      .glow-overlay { animation: glow-pulse 3s ease-in-out infinite; }
    </style>
    <filter id="matrix-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect class="matrix-bg" width="800" height="600"/>


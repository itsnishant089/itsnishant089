<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      @keyframes grid-scan {
        0% { transform: translateY(0); }
        100% { transform: translateY(40px); }
      }
      @keyframes grid-pulse {
        0%, 100% { opacity: 0.05; }
        50% { opacity: 0.12; }
      }
      .grid-base { stroke: #00ff88; stroke-width: 0.5; fill: none; opacity: 0.08; }
      .grid-accent { stroke: #00c6ff; stroke-width: 0.8; fill: none; opacity: 0.06; }
      .grid-scan-line {
        stroke: #00ff88;
        stroke-width: 1;
        opacity: 0.15;
        animation: grid-scan 4s linear infinite;
      }
      .grid-group { animation: grid-pulse 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base grid - horizontal lines -->
  <g class="grid-group">
    <line class="grid-base" x1="0" y1="0" x2="800" y2="0"/>
    <line class="grid-base" x1="0" y1="40" x2="800" y2="40"/>
    <line class="grid-base" x1="0" y1="80" x2="800" y2="80"/>
    <line class="grid-base" x1="0" y1="120" x2="800" y2="120"/>
    <line class="grid-base" x1="0" y1="160" x2="800" y2="160"/>
    <line class="grid-base" x1="0" y1="200" x2="800" y2="200"/>
    <line class="grid-base" x1="0" y1="240" x2="800" y2="240"/>
    <line class="grid-base" x1="0" y1="280" x2="800" y2="280"/>
    <line class="grid-base" x1="0" y1="320" x2="800" y2="320"/>
    <line class="grid-base" x1="0" y1="360" x2="800" y2="360"/>
    <line class="grid-base" x1="0" y1="400" x2="800" y2="400"/>
    <line class="grid-base" x1="0" y1="440" x2="800" y2="440"/>
    <line class="grid-base" x1="0" y1="480" x2="800" y2="480"/>
    <line class="grid-base" x1="0" y1="520" x2="800" y2="520"/>
    <line class="grid-base" x1="0" y1="560" x2="800" y2="560"/>
    <line class="grid-base" x1="0" y1="600" x2="800" y2="600"/>

    <!-- Base grid - vertical lines -->
    <line class="grid-base" x1="0" y1="0" x2="0" y2="600"/>
    <line class="grid-base" x1="40" y1="0" x2="40" y2="600"/>
    <line class="grid-base" x1="80" y1="0" x2="80" y2="600"/>
    <line class="grid-base" x1="120" y1="0" x2="120" y2="600"/>
    <line class="grid-base" x1="160" y1="0" x2="160" y2="600"/>
    <line class="grid-base" x1="200" y1="0" x2="200" y2="600"/>
    <line class="grid-base" x1="240" y1="0" x2="240" y2="600"/>
    <line class="grid-base" x1="280" y1="0" x2="280" y2="600"/>
    <line class="grid-base" x1="320" y1="0" x2="320" y2="600"/>
    <line class="grid-base" x1="360" y1="0" x2="360" y2="600"/>
    <line class="grid-base" x1="400" y1="0" x2="400" y2="600"/>
    <line class="grid-base" x1="440" y1="0" x2="440" y2="600"/>
    <line class="grid-base" x1="480" y1="0" x2="480" y2="600"/>
    <line class="grid-base" x1="520" y1="0" x2="520" y2="600"/>
    <line class="grid-base" x1="560" y1="0" x2="560" y2="600"/>
    <line class="grid-base" x1="600" y1="0" x2="600" y2="600"/>
    <line class="grid-base" x1="640" y1="0" x2="640" y2="600"/>
    <line class="grid-base" x1="680" y1="0" x2="680" y2="600"/>
    <line class="grid-base" x1="720" y1="0" x2="720" y2="600"/>
    <line class="grid-base" x1="760" y1="0" x2="760" y2="600"/>
    <line class="grid-base" x1="800" y1="0" x2="800" y2="600"/>
  </g>

  <!-- Perspective accent lines -->
  <g>
    <line class="grid-accent" x1="400" y1="300" x2="0" y2="0"/>
    <line class="grid-accent" x1="400" y1="300" x2="800" y2="0"/>
    <line class="grid-accent" x1="400" y1="300" x2="0" y2="600"/>
    <line class="grid-accent" x1="400" y1="300" x2="800" y2="600"/>
    <line class="grid-accent" x1="400" y1="300" x2="400" y2="0"/>
    <line class="grid-accent" x1="400" y1="300" x2="400" y2="600"/>
    <line class="grid-accent" x1="400" y1="300" x2="0" y2="300"/>
    <line class="grid-accent" x1="400" y1="300" x2="800" y2="300"/>
  </g>

  <!-- Scanning line effect -->
  <line class="grid-scan-line" x1="0" y1="0" x2="800" y2="0"/>
</svg>
